name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Two separate Go modules live in this repo: the library at the root,
      # and examples/ on its own — see examples/go.mod for why (keeps
      # demo-only deps like bubbles/lipgloss out of the library's go.mod).
      # Everything below runs for each module in turn.

      - name: Verify root go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify examples/go.mod / go.sum are tidy
        working-directory: examples
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build (root module)
        run: go build ./...

      - name: Vet (root module)
        run: go vet ./...

      - name: Test (root module)
        run: go test -race -v ./...

      - name: Build (examples module)
        working-directory: examples
        run: go build ./...

      - name: Vet (examples module)
        working-directory: examples
        run: go vet ./...
